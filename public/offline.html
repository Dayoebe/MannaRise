<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#047857">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="MannaRise">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <title>MannaRise Offline</title>
    <style>
        body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: linear-gradient(180deg, #ecfdf5, #f8fafc); color: #0f172a; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: env(safe-area-inset-top) 1rem env(safe-area-inset-bottom); }
        main { width: min(100%, 31rem); border: 1px solid #d1fae5; background: rgba(255, 255, 255, .96); border-radius: 1.25rem; padding: 1.4rem; box-shadow: 0 20px 60px rgba(15, 23, 42, .12); }
        span { display: inline-grid; place-items: center; width: 3.5rem; height: 3.5rem; border-radius: 1rem; background: #ecfdf5; color: #047857; font-size: 1.8rem; }
        h1 { margin: 1rem 0 .5rem; font-size: clamp(1.8rem, 8vw, 3rem); line-height: 1; }
        p { color: #475569; line-height: 1.7; }
        a { display: inline-flex; margin-top: 1rem; border-radius: 999px; background: #047857; color: white; padding: .85rem 1.2rem; text-decoration: none; font-weight: 800; }
    </style>
</head>
<body>
    <main>
        <span>✦</span>
        <h1>You are offline</h1>
        <p>MannaRise could not reach the network. Previously opened pages may still be available. Reconnect and try again when you are ready.</p>
        <a href="/">Return home</a>
    </main>
</body>
</html>
